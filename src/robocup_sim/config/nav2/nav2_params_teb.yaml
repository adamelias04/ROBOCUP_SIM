# Nav2 pre shoddy s TEB (teb_local_planner, buildi sa zo zdrojov v tomto ws).
# Naviguje sa v `odom` s klzavou globalnou costmapou, bez statickej mapy.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 12.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"
      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_samples: 500
      global_plan_overwrite_orientation: True
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 3.0
      global_plan_viapoint_sep: -1.0
      global_plan_prune_distance: 1.0
      exact_arc_length: False
      feasibility_check_no_poses: 5
      publish_feedback: False

      max_vel_x: 1.0
      max_vel_x_backwards: 0.8
      max_vel_y: 0.0
      max_vel_theta: 1.0
      acc_lim_x: 3.0
      acc_lim_theta: 2.8
      min_turning_radius: 0.0

      footprint_model:
        type: "polygon"
        vertices: "[[0.28, 0.235], [0.28, -0.235], [-0.28, -0.235], [-0.28, 0.235]]"

      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 6.28
      free_goal_vel: False

      min_obstacle_dist: 0.05
      inflation_dist: 0.45
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 1.5
      obstacle_poses_affected: 25
      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: True

      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 1.0
      weight_max_vel_x: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 1.0
      weight_acc_lim_theta: 1.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 20.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 0.8
      weight_shortest_path: 0.0
      weight_obstacle: 80.0
      weight_inflation: 0.1
      weight_dynamic_obstacle: 50.0
      weight_dynamic_obstacle_inflation: 0.1
      weight_viapoint: 20.0
      weight_adapt_factor: 2.0

      enable_homotopy_class_planning: False
      enable_multithreading: True
      max_number_classes: 3
      selection_cost_hysteresis: 1.0
      selection_prefer_initial_plan: 0.95
      selection_obst_cost_scale: 100.0
      selection_alternative_time_cost: False
      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 6.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 1.0
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 1.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[[0.28, 0.235], [0.28, -0.235], [-0.28, -0.235], [-0.28, 0.235]]"
      transform_tolerance: 0.2
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        observation_sources: sim_scan_marking sim_scan_clearing
        sim_scan_marking:
          topic: /scan
          sensor_frame: lidar_frame
          data_type: "LaserScan"
          marking: true
          clearing: false
          inf_is_valid: false
          obstacle_max_range: 15.0
          raytrace_max_range: 18.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        sim_scan_clearing:
          topic: /scan
          sensor_frame: lidar_frame
          data_type: "LaserScan"
          marking: false
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 15.0
          raytrace_max_range: 18.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.5
        cost_scaling_factor: 4.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      origin_x: -15.0
      origin_y: -15.0
      footprint: "[[0.28, 0.235], [0.28, -0.235], [-0.28, -0.235], [-0.28, 0.235]]"
      transform_tolerance: 0.5
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        observation_sources: sim_scan_marking sim_scan_clearing
        sim_scan_marking:
          topic: /scan
          sensor_frame: lidar_frame
          data_type: "LaserScan"
          marking: true
          clearing: false
          inf_is_valid: false
          obstacle_max_range: 15.0
          raytrace_max_range: 18.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        sim_scan_clearing:
          topic: /scan
          sensor_frame: lidar_frame
          data_type: "LaserScan"
          marking: false
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 15.0
          raytrace_max_range: 18.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.5
        cost_scaling_factor: 4.0
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.8

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
