# Nav2 parameters for the MRVK "shoddy" robot — DWB tuned like the ROS1
# TrajectoryPlannerROS. Navigation is done in the `odom` frame with a
# rolling-window global costmap (no static map), matching the ROS1 project.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 12.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 6.28   # 2*pi = ignoruj finalnu orientaciu robota

    # "Trajectory Rollout" variant — the ROS1 base_local_planner
    # TrajectoryPlannerROS has no 1:1 Nav2 port; DWB is the unification of DWA
    # and Trajectory Rollout, so this is DWB with the shorter horizon / coarser
    # sampling of base_local_planner.yaml (sim_time 1.0, vx 8, vth 20).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # ROS1 TrajectoryPlannerROS mal escape_vel -0.2 (unik cuvanim);
      # DWB ekvivalent nema, takze zaporna min_vel_x ho nahradza.
      min_vel_x: -0.2
      min_vel_y: 0.0
      max_vel_x: 1.0
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.1
      max_speed_xy: 1.0
      min_speed_theta: 0.40   # ROS1 min_in_place_vel_theta
      acc_lim_x: 3.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.8
      decel_lim_x: -3.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.8
      vx_samples: 8
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.10
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.10
      PathAlign.scale: 0.6
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 0.8
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 0.6
      GoalDist.scale: 0.8
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      # Rectangle over the bumpers (x ±0.275) and the wheels (y ±0.2325).
      footprint: "[[0.28, 0.235], [0.28, -0.235], [-0.28, -0.235], [-0.28, 0.235]]"
      transform_tolerance: 0.2
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        # Isaac's RTX lidar (relayed to /scan with no-hit beams as inf):
        # one source marks hits, the other clears along every beam
        # including the inf ones.
        observation_sources: sim_scan_marking sim_scan_clearing
        sim_scan_marking:
          topic: /scan
          sensor_frame: lidar_frame
          data_type: "LaserScan"
          marking: true
          clearing: false
          inf_is_valid: false
          obstacle_max_range: 15.0
          raytrace_max_range: 18.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        sim_scan_clearing:
          topic: /scan
          sensor_frame: lidar_frame
          data_type: "LaserScan"
          marking: false
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 15.0
          raytrace_max_range: 18.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Above the footprint's inscribed radius (0.245), so NavFn keeps the
        # plan centred in doorways instead of hugging the frame.
        inflation_radius: 0.5
        cost_scaling_factor: 4.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.05
      origin_x: -15.0
      origin_y: -15.0
      # Rectangle over the bumpers (x ±0.275) and the wheels (y ±0.2325).
      footprint: "[[0.28, 0.235], [0.28, -0.235], [-0.28, -0.235], [-0.28, 0.235]]"
      transform_tolerance: 0.5
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        # Isaac's RTX lidar (relayed to /scan with no-hit beams as inf):
        # one source marks hits, the other clears along every beam
        # including the inf ones.
        observation_sources: sim_scan_marking sim_scan_clearing
        sim_scan_marking:
          topic: /scan
          sensor_frame: lidar_frame
          data_type: "LaserScan"
          marking: true
          clearing: false
          inf_is_valid: false
          obstacle_max_range: 15.0
          raytrace_max_range: 18.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
        sim_scan_clearing:
          topic: /scan
          sensor_frame: lidar_frame
          data_type: "LaserScan"
          marking: false
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 15.0
          raytrace_max_range: 18.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Above the footprint's inscribed radius (0.245), so NavFn keeps the
        # plan centred in doorways instead of hugging the frame.
        inflation_radius: 0.5
        cost_scaling_factor: 4.0
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.8

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
